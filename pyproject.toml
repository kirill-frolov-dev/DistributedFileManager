[project]
name = "distributed-file-manager"
version = "0.1.0"
description = "Библиотека для управления размещением больших файлов в распределённом хранилище"
readme = "README.md"
authors = [
    {name = "Фролов Кирилл"},
    {name = "Исмагзеев Темэркан "},
]
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"